# Netlify configuration for repstraining.com
# This is a plain static site: no build step, just publish the HTML files as-is.

[build]
  publish = "."     # serve the files in the root of this repo
  command = ""      # nothing to build

# Netlify automatically serves clean URLs:
#   /pricing  -> pricing.html
#   /privacy  -> privacy.html
#   /terms    -> terms.html
#   (and so on for every .html file)
